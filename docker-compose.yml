version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agriconnect
      POSTGRES_USER: agriconnect
      POSTGRES_PASSWORD: agriconnect
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agriconnect"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_USERNAME: agriconnect
      DB_PASSWORD: agriconnect
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/agriconnect
      JWT_SECRET: change-this-in-production-min-32-characters-long
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      # Read from the shell or a root .env file (see .env.example). Empty means
      # payments/weather return 502; everything else still works.
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
