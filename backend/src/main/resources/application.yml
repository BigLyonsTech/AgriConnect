server:
  port: 8080

spring:
  application:
    name: agriconnect-farm
  datasource:
    url: jdbc:postgresql://localhost:5432/agriconnect
    username: ${DB_USERNAME:agriconnect}
    password: ${DB_PASSWORD:agriconnect}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: true
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    # No default on purpose: JwtService refuses to start without a real secret.
    secret: ${JWT_SECRET:}
    expiration-ms: 86400000
  rate-limit:
    auth:
      # Per client IP, per auth endpoint (login, register, demo, demo reset).
      max-requests: ${AUTH_RATE_LIMIT:10}
      window-seconds: 60
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  paystack:
    secret-key: ${PAYSTACK_SECRET_KEY:}
  weather:
    api-key: ${WEATHER_API_KEY:}

logging:
  level:
    com.agriconnect: ${LOG_LEVEL:INFO}
