spring:
  datasource:
    url: jdbc:h2:mem:agriconnect_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: true

app:
  jwt:
    secret: test-secret-key-for-junit-tests-only-32-chars-min
    expiration-ms: 3600000
