spring:
  datasource:
    url: jdbc:h2:mem:agriconnect_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      # Tests build the schema from the Flyway migrations, so drift between
      # the SQL and the entities fails the build.
      ddl-auto: validate
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: true

app:
  rate-limit:
    auth:
      # Every test calls from 127.0.0.1; AuthRateLimitFilterTest covers the limiter itself.
      max-requests: 100000
  jwt:
    secret: test-secret-key-for-junit-tests-only-32-chars-min
    expiration-ms: 3600000
